<!DOCTYPE html> 
<html lang="en"> 
    <head> 
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Sign Up | Cupid's Board</title> 
        <!-- Main Stylesheet -->
  <link rel="stylesheet" href="style.css">
    </head> 
    <body> 
        <header> 
            <nav> 
                <a href="index.html">Cupid's Board</a> 
                <a href="login.html">Log In</a> 
            </nav> 
        </header> 
        <main> 
            <section aria-labelledby="signup-heading"> 
                <h1 id="signup-heading">Create Your Board</h1> 
                <p>Start capturing love, memories, and meaningful moments in one safe space.</p>

                    <form action="feed.html" method="post">
        <fieldset>
            <legend>Account Information</legend>

            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="6">

            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm-password" required minlength="6">
        </fieldset>

        <button type="submit">Create Account</button>
    </form>

    <p>
        Already have an account?
        <a href="login.html">Log in</a>
    </p>
</section>
</main> 
<footer> 
    <p>© 2026 Cupid's Board</p> 
</footer> 
</body> 
</html>
