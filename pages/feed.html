<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <link href="../styles/feed.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Permanent+Marker&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <title>Cupid's Board</title>
</head>
<body>
  <nav class="navbar">
  <div class="nav-left">
    <span class="material-icons logo-icon">favorite</span>
    <h1 class="logo-text">Cupid's Board</h1>
  </div>
  <div class="nav-right">
    <div class="search-container">
      <input
        type="text"
        placeholder="Search memories..."
        class="search-input"
      >
      <span class="material-icons search-icon">search</span>
    </div>
    <div class="nav-actions">
      <button class="notification-btn">
        <span class="material-icons">notifications</span>
      </button>
      <div class="profile-container">
        <img
          src="https://lh3.googleusercontent.com/aida-public/AB6AXuDRGr8Ved7BtCVldKXa-JFkV8ilTRgAF1m7sfV12bTUgjejwhjzrw4UVeKHSN_TVQPv3ICgywv7gnoQdeehoXqKgzCuE8rO4zyDh5DXOGAeoTdWGBBw78sP8Vd9Mntw4oc-iD_IP5w_dPdJyPRpYs6bO0dciyEpY6kmXaklBgvc1CqIV-eWnhocnmtFrW2ofzdeSG-1AGm3J8GWq6Gt-83fGNa5B7VMfWa7gfdpC6O8uymnLGn4p-67oSAe3Jmhdye_UDxgCWEU7oE"
          class="profile-image"
        >
      </div>
    </div>
  </div>
</nav>
<main class="corkboard-main">
  <div class="board-container">
    <div class="masonry-grid">
      <!-- ITEM -->
      <div class="masonry-item rotate-neg-2">
        <div class="polaroid-card">
          <div class="washi-tape"></div>
          <img
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuDzwX-LdyHixbjJMbe5kQMK_HAfqy5gR6VxIPWbfy2llt1_6ouEUTE4uFh449NGmwnPzgNOMHKxE0IBwXrLdeTurk3mqBdZNDCe0fQ4A5PWix9BaJXtYaHF0-MD1Fm3QyGyt1md1e9CmsY1mRzx35LDQ8xmzl37UjB65zY-FJS_HSED8WcHU91I0DBno3fPYGdAFzrXGzNc5h1e-La4ORnzbkvxvueg9f19YMaw_6KHLjLkvLnIp1MP3llxZUVV0XQLNlm-WKIRAO8"
            class="polaroid-image"
          >
          <p class="handwriting text-center">
            First date magic ✨
          </p>
          <span class="polaroid-date">
            June 12th
          </span>
        </div>
      </div>
      <div class="masonry-item rotate-pos-1">
        <div class="postit-card">
          <h3 class="marker-title">
            Love Note
          </h3>
          <p class="handwriting large-text">
            "I still remember the way the coffee smelled that morning..."
          </p>
        </div>
      </div>
      <!-- CASSETTE -->
      <div class="masonry-item rotate-neg-1">
        <div class="cassette-card">
          <div class="cassette-body">
            <button class="play-button">
              <span class="material-icons">
                play_arrow
              </span>
            </button>
          </div>
          <div class="cassette-footer">
            <span class="marker-small">
              VOICE_MEMO_04.wav
            </span>
            <span class="duration">
              02:45
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
</body>
</html>
