<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <link href="../styles/auth.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Permanent+Marker&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <title>Login to Cupid's Board</title>
</head>
    <body> 
        <header> 
            <nav> 
                <a href="../index.html">Cupid's Board</a> 
            </nav> 
        </header> 
        <main> 
            <section aria-labelledby="login-heading"> 
                <h1 id="login-heading">Welcome Back</h1> 
                <p>Log in to continue building your board.</p>
                <form action="pages/feed.html" method="post">
                    <fieldset>
                        <legend>Account Information</legend>

                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required>

                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required minlength="6">
                    </fieldset>

                    <button class="btn btn-primary" type="submit">Log In</button>
                </form>
                <p>
                    Don't have an account?
                    <a href="signup.html">Sign up</a>
                </p>
            </section>  
        </main>
        <footer> 
            <p>© 2026 Cupid's Board</p>
        </footer>
    </body>
</html>
